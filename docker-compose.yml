version: '3.9'

services:

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"

  catalog-service:
    build: ./catalog-service
    container_name: catalog-service
    ports:
      - "8082:8082"

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8083:8083"

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8084:8084"

  frontend-angular:
    build: ./frontend-angular
    container_name: frontend-angular
    ports:
      - "4200:4200"