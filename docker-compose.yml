services:

  # ============================
  # DATABASE USER
  # ============================

  postgres-user:
    image: postgres:16
    container_name: postgres-user
    restart: always
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data



  # ============================
  # USER SERVICE
  # ============================

  user-service:
    build: ./user-service
    container_name: user-service
    depends_on:
      - postgres-user
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/userdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: &jwt_secret "N2Q5YzNmMGY4YjJhNGQ2ZTliMWM3ZDhlNWEzZjJiOWM3ZDhlNWEzZjJiOWM3ZDhlNWEzZjJiOWM="



  # ============================
  # DATABASE CATALOG
  # ============================

  postgres-catalog:
    image: postgres:16-alpine
    container_name: postgres-catalog
    restart: always
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data



  # ============================
  # CATALOG SERVICE
  # ============================

  catalog-service:
    build: ./catalog-service
    container_name: catalog-service
    depends_on:
      - postgres-catalog
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-catalog:5432/catalogdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    volumes:
      - catalog_uploads:/app/uploads/produits




  # ============================
  # DATABASE ORDER
  # ============================

  postgres-order:
    image: postgres:16
    container_name: postgres-order
    restart: always
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data



  # ============================
  # ORDER SERVICE
  # ============================

  order-service:
    build: ./order-service
    container_name: order-service
    depends_on:
      - postgres-order
      - user-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/orderdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres





  # ============================
  # DATABASE PAYMENT
  # ============================

  postgres-payment:
    image: postgres:16
    container_name: postgres-payment
    restart: always
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data




  # ============================
  # PAYMENT SERVICE
  # ============================

  payment-service:
    build: ./payment-service
    container_name: payment-service
    depends_on:
      - postgres-payment
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/paymentdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres





  # ============================
  # API GATEWAY
  # ============================

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      - user-service
      - catalog-service
      - order-service
      - payment-service
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: *jwt_secret




  # ============================
  # FRONTEND ANGULAR
  # ============================

  frontend-angular:
    build: ./frontend-angular
    container_name: frontend-angular
    depends_on:
      - api-gateway
    ports:
      - "4200:4200"
    volumes:
      - ./frontend-angular:/app
      - /app/node_modules



# ============================
# VOLUMES
# ============================

volumes:

  postgres_user_data:

  postgres_catalog_data:

  postgres_order_data:

  postgres_payment_data:

  catalog_uploads: