<app-admin-nav></app-admin-nav>

<h1 class="h4 mb-4">Gestion des utilisateurs</h1>

@if (loading) {
  <div class="text-center py-5">
    <div class="spinner-border"></div>
  </div>
} @else {
  <table class="table align-middle">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Email</th>
        <th>Rôle</th>
        <th>Statut</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (user of users; track user.id) {
        <tr>
          <td>{{ user.prenom }} {{ user.nom }}</td>
          <td>{{ user.email }}</td>
          <td><span class="badge text-bg-light border">{{ user.profil }}</span></td>
          <td>
            <span
              class="badge"
              [class.text-bg-success]="user.isActive"
              [class.text-bg-secondary]="!user.isActive"
            >
              {{ user.isActive ? 'Actif' : 'Désactivé' }}
            </span>
          </td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-secondary" (click)="toggleActive(user)">
              {{ user.isActive ? 'Désactiver' : 'Activer' }}
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
}
