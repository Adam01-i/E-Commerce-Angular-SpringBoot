services:
  postgres-order:
    image: postgres:16
    container_name: postgres-order
    restart: always
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
  order-service:
    build: .
    container_name: order-service
    depends_on:
      - postgres-order
    ports:
      - "8083:8083"
    environment:
       DB_HOST: postgres-order
       DB_PORT: 5432
       DB_USER: postgres
       DB_PASSWORD: postgres
volumes:
  postgres_order_data:
