version: '3.9'

services:

  catalog-service:
    build: . # Correction ici : le point signifie que le Dockerfile est dans le même dossier
    container_name: catalog-service
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=postgres-catalog
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - postgres-catalog

  postgres-catalog:
    image: postgres:16-alpine
    container_name: postgres-catalog
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data

volumes:
  postgres_catalog_data: