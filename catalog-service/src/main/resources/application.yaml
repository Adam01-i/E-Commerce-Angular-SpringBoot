server:
  port: 8082


spring:
  application:
    name: catalog-service

  datasource:
    url: jdbc:postgresql://postgres-catalog:5432/catalogdb
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

app:
  upload-dir: uploads/produits


springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html


logging:
  level:
    org.springframework: INFO