server:
  port: 8080


spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: user-service
              uri: http://user-service:8081
              predicates:
                - Path=/api/users/**

            - id: catalog-service
              uri: http://catalog-service:8082
              predicates:
                - Path=/api/catalog/**

            - id: order-service
              uri: http://order-service:8083
              predicates:
                - Path=/api/orders/**

            - id: payment-service
              uri: http://payment-service:8084
              predicates:
                - Path=/api/payments/**


management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    gateway:
      enabled: true